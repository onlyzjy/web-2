<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="周佳颖的作品集 —— 摄影与日常记录">
    <title>我的作品 | 周佳颖的个人主页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=ZCOOL+KuaiLe&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="gallery.css">
</head>

<body>
    <a class="back-link" href="index.html">← 返回主页</a>

    <main class="gallery-page">
        <h1 class="gallery-title">我的作品</h1>
        <p class="gallery-sub">My Photos · My Moments</p>

        <figure class="showcase">
            <div class="showcase-frame">
                <img id="showcase-img" src="gallery-1.jpg" alt="体育馆里的灯带与光">
            </div>
            <figcaption class="showcase-bar">
                <span class="dots" id="dots" aria-hidden="true"></span>
                <span class="counter" id="counter">1 / 8</span>
            </figcaption>
        </figure>

        <div class="thumbs" id="thumbs" aria-label="作品缩略图"></div>
    </main>

    <script src="gallery.js" defer></script>
</body>

</html>
